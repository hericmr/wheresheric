name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Clean reference directories from public folder
        run: |
          rm -rf public/onde_esta_heric_trans public/vehicle-tracking public/cameras || true
      
      - name: Build project
        run: npm run build
        env:
          PUBLIC_URL: https://hericmr.github.io/wheresheric
      
      - name: Clean reference directories from build output
        run: |
          rm -rf build/onde_esta_heric_trans build/vehicle-tracking build/cameras || true
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: false


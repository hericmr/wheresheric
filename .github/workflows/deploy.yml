name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Clean reference directories from public folder
        run: |
          rm -rf public/onde_esta_heric_trans public/vehicle-tracking public/cameras || true
      
      - name: Build project
        run: npm run build
        env:
          PUBLIC_URL: https://hericmr.github.io/wheresheric
          REACT_APP_SUPABASE_URL: https://ypxauswxgbdegvkxgzmi.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlweGF1c3d4Z2JkZWd2a3hnem1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI3MDUzNTIsImV4cCI6MjA2ODI4MTM1Mn0._jYk-5djNOllJIGSwRD1lzXWSq5mcZrVijQMC3bTYYc
      
      - name: Clean reference directories from build output
        run: |
          rm -rf build/onde_esta_heric_trans build/vehicle-tracking build/cameras || true
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

